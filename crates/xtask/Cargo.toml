# The macOS dev bundle is made with the same library code that cef's `bundle-cef-app` runs
# (cef::build_util::mac::bundle), called directly so release bundles work too.
[target.'cfg(target_os = "macos")'.dependencies]
cef.workspace = true
semver.workspace = true

