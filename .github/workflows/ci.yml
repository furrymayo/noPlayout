# CI for the public phase (PLAN §8.1, D-003). Four lanes plus the licence gate.
# Third-party actions are pinned by commit SHA; no secrets; never pull_request_target.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly on main: advisories against the latest RustSec database (E-032).
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep in step with Cargo.toml / crates/xtask (an xtask test checks those two agree).
  CEF_CACHE_VERSION: "156.7.0+156.0.31"
  CARGO_DENY_VERSION: "0.22.1"
  CARGO_DENY_SHA256: "13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d"

jobs:
  build:
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            fmt: true
            self_test: required
            conformance: required
          - lane: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            # PLAN §8.1: CEF tests on Windows once S4/R13 prove them; run it, but don't gate on it.
            self_test: informational
            conformance: informational
          - lane: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            self_test: required
            conformance: required
          - lane: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            self_test: required
            conformance: informational
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system packages (Tauri v2, udev, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev libudev-dev xvfb

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: CEF cache
        id: cef-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ env.CEF_CACHE_VERSION }}

      - name: Export CEF (cache miss)
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: cargo xtask cef

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI (npm ci, check, test, build)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build

      - name: rustfmt
        if: matrix.fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --locked --workspace

      - name: build --release
        run: cargo build --locked --workspace --release

      - name: Licences in the renderer (E-032)
        if: runner.os == 'Linux'
        run: cargo xtask licences

      - name: Self-test (engine spawns output + renderer, checks Hello)
        if: matrix.self_test == 'required'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo xtask self-test --release
          else
            cargo xtask self-test --release
          fi

      - name: Self-test (informational until S4/R13)
        if: matrix.self_test == 'informational'
        continue-on-error: true
        run: cargo xtask self-test --release

      # M1 tasks 9 and 10: every EBU example and Basketball graphic through the real CEF
      # renderer, then the pixel goldens (tests/conformance). Required on linux and macos-arm64.
      - name: Conformance + pixel tests
        id: conformance
        continue-on-error: ${{ matrix.conformance == 'informational' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo xtask conformance --release
          else
            cargo xtask conformance --release
          fi

      - name: Conformance candidates (failed or missing goldens)
        if: always() && steps.conformance.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.lane }}
          path: target/conformance/
          if-no-files-found: ignore

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml; cargo-deny runs cargo metadata)
        run: rustup toolchain install
      - name: Install cargo-deny ${{ env.CARGO_DENY_VERSION }} (checksum-verified)
        run: |
          f="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${f}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${f}.tar.gz" | sha256sum -c -
          tar xzf "${f}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          mv "${f}/cargo-deny" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cargo deny check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            cargo deny --locked check advisories
          else
            cargo deny --locked check
          fi
